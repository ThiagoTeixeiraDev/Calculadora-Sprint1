<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculadora</title>
</head>

<body>

    <div> <!--Bloco 1-->
        <div></div> <!--Título: SIMULE SEUS DADOS-->
        <div></div> <!--COMO CALCULAMOS-->
        <div> <!--DIV PARA COLOCAR INPUT, SELECT E BOTÃO-->
            <div></div> <!--INPUT OU SELECT-->
            Inserir quantas toneladas produz por ano? <input id="inp_ton"> 
            <button onclick="calculartoneladas()">Calcular faturamento</button><br>
            Quantas toneladas em média você produz por ano? <br><br><input id="ipt_tonelada"> <br> <!--INPUT OU SELECT-->
            Qual o valor médio da garrafa do seu vinho? <br><br> <input id="ipt_garrafa"> <!--ESSE INPUT SÓ APARECE SE O CLIENTE FOR PRODUTOR DA UVA E VENDE VINHO-->
            <button onclick="calculo_tonelada_uva_vinho()">Cálcular tonelada</button> <!--BOTÃO-->
            <div id="div_msg"></div><br> <!--Cração da DIV para chamar a resposta da função calculo_tonelada_uva-->
            <div id="div_msg2"></div>  <!--Criação da DIV para chamar a resposta da funcao calculartoneladas-->
        </div>
    </div>

    <div> <!--Bloco 2-->
        <div></div> <!--BLOCO VERMELHO: QUANTO VOCÊ ESTÁ LUCRANDO COM O NOSSO PRODUTO-->
        <div>
            <div>
                <div></div> <!--BLOCO BRANCO: QUANTO DE DINHEIRO VOCÊ ESTÁ PERDENDO-->
                <div></div> <!--BLOCO BRANCO: QUANTO VOCÊ ESTÁ LUCRANDO SEM NOSSO PRODUTO-->
            </div>
            <div>
                <div></div> <!--BLOCO BRANCO: QUANTAS TONELADAS VOCÊ ESTÁ PERDENDO SEM NOSSO PRODUTO-->
                <div></div> <!--BLOCO BRANCO: QUANTAS GARRADAS DE VINHO ELE VAI PRODUZIR COM O NOSSO PRODUTO -->
            </div>
        </div>
    </div>

</body>

</html>
<script>
    function calculo_tonelada_uva_vinho() { //ESSE CÁLCULO É VALIDO SOMENTE PARA PRODUTORES DO -> VINHO E DA UVA <-
        let toneladas = Number(ipt_tonelada.value);    // NÚMERO EM TONELADAS DO PRODUTOR
        let preco_garrafa = Number(ipt_garrafa.value);   // PREÇO VINHO DO PRODUTOR
        let garrafas_tonelada = 720; // A PRODUÇÃO DE GARRAFAS POR TONELADA É DE 720 
        let total_garrafa = toneladas * 720; // QUANTAS GARRAFAS PRODUZEM POR TONELADA
        let percent_perda = total_garrafa * 0.20; // EM MÉDIA É PERDIDO 20% DE TUDO QUE PRODUZEM (SEM O PRODUTO)
        let producao_final = total_garrafa - percent_perda; // CÁLCULO QUE EVIDÊNCIA AS PERDAS SOBRE O TODO DAS GARRAFAS
        let lucro_sem_produto = percent_perda * preco_garrafa;  // FATURAMENTO SEM O PRODUTO
        let lucro_com_produto = total_garrafa * preco_garrafa; // FATURAMENTO COM O PRODUTO
        let diferenca_com_sem_produto = lucro_com_produto - lucro_sem_produto; // DIFERENÇA DE LUCRO SEPARADA
        div_msg.innerHTML = `Como usuário produtor de uva e vendedor de vinho, nosso cálculo se baseia primeiro nas
        suas ${toneladas} produzidas, levando em conta que cada tonelada me traz ${garrafas_tonelada}, nos dando
        a informação de ${total_garrafa} produzidas. De acordo com a queda de 20% levantada, sua perca foi de
        ${percent_perda}, gerando um descréscimo total de ${producao_final}, evidenciando o principal:
        Sem nós, você lucra somente ${lucro_sem_produto}, conosco, você fatura incríveis ${lucro_com_produto}` // DIV criada para exibição dos cálculos do cliente produtos&vendedor
            }
    function calculartoneladas(){ // Esse calculo é para APENAS o produtor da uva//
        let toneladas= Number(inp_ton.value) // Transformar o texto em número e puxar o valor do input com o value//
        let faturamento= toneladas * 15000;//Calcular o faturamento medio de 1 tonelada em reais//
        let perda= faturamento * 0.2; // Perda de 20% dos produtores por conta dos fungos, ou seja, SEM nosso produto//
        let faturamentototal= faturamento + perda; // faturamento COM o nosso produto//
        let diferenca= faturamentototal - faturamento; // A diferença que o produtor vai ter implementando nosso projeto em seu terreno //
           div_msg2.innerHTML = `Como Cliente produtor, além de sua produção de ${toneladas} toneladas, nossa
           pesquisa indicou que o seu faturamento por suas toneladas foi de ${faturamento}. Entretanto, sem nosso prooduto, a perca
           de 20% relatada na pesquisa, faz com que seu lucro despenque para ${perda},
           enquanto com nossa solução, você lucra ${faturamentototal} reais, 
           mostrando um lucro expressivo de ${diferenca}`  // DIV CRIADA PARA A EXIBIÇÃO DOS CÁLCULOS DA FUNÇÃO calcular toneladas
       
       }
</script>
